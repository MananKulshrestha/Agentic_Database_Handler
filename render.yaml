services:
  - type: web
    name: agentic-database-handler-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.render_start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_DATABASE_URL
        fromDatabase:
          name: agentic-database-handler-db
          property: connectionString
      - key: DBH_ENCRYPTION_SECRET
        generateValue: true
      - key: AUTH_REQUIRED
        value: "false"
      - key: AUTH_BOOTSTRAP_SECRET
        generateValue: true
      - key: OPENAI_ALLOW_SCHEMA_SHARING
        value: "true"
      - key: TYPESAFE_ALLOW_SCHEMA_SHARING
        value: "true"

databases:
  - name: agentic-database-handler-db
    plan: free
    region: singapore
    ipAllowList: []
