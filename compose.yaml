services:
  app-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: handler
      POSTGRES_USER: handler
      POSTGRES_PASSWORD: handler
    ports:
      - "5432:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handler -d handler"]
      interval: 5s
      timeout: 3s
      retries: 10
  demo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5433:5432"
    volumes:
      - ./demo/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  app_db_data:
